<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - Dashboard Admin Desa Cikelat</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            primary: "#3f9891",
                        },
                    },
                },
            };
        </script>
    </head>
    <body
        class="min-h-screen bg-gradient-to-br from-primary to-teal-700 flex items-center justify-center"
    >
        <div class="bg-white rounded-lg shadow-2xl p-8 w-full max-w-md">
            <!-- Logo dan Header -->
            <div class="text-center mb-8">
                <div
                    class="w-20 h-20 mx-auto mb-4 rounded-full bg-primary flex items-center justify-center"
                    style="
                        background-image: url('data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><defs><pattern id=\'grid\' width=\'10\' height=\'10\' patternUnits=\'userSpaceOnUse\'><path d=\'M 10 0 L 0 0 0 10\' fill=\'none\' stroke=\'rgba(255,255,255,0.1)\' stroke-width=\'1\'/></pattern></defs><rect width=\'100%\' height=\'100%\' fill=\'url(%23grid)\'/></svg>');
                    "
                >
                    <svg
                        class="w-12 h-12 text-white"
                        fill="currentColor"
                        viewBox="0 0 20 20"
                    >
                        <path
                            d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"
                        />
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-800 mb-2">
                    Desa Cikelat
                </h1>
                <p class="text-gray-600 text-sm">
                    Dashboard Admin Website Pemerintah Desa Cikelat
                </p>
            </div>

            <!-- Form Login -->
            <form id="loginForm" class="space-y-6">
                <div>
                    <label
                        for="username"
                        class="block text-sm font-medium text-gray-700 mb-2"
                        >Username</label
                    >
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                    />
                </div>

                <div>
                    <label
                        for="password"
                        class="block text-sm font-medium text-gray-700 mb-2"
                        >Password</label
                    >
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                    />
                </div>

                <div
                    id="errorMessage"
                    class="hidden text-red-600 text-sm text-center"
                ></div>

                <button
                    type="submit"
                    id="loginBtn"
                    class="w-full bg-primary text-white py-2 px-4 rounded-md hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition duration-200"
                >
                    Masuk
                </button>
            </form>

            <!-- Footer -->
            <div class="mt-8 text-center text-xs text-gray-500">
                <p>&copy; 2025 Pemerintah Desa Cikelat. All rights reserved.</p>
            </div>
        </div>

        <script>
            document
                .getElementById("loginForm")
                .addEventListener("submit", async (e) => {
                    e.preventDefault();

                    const loginBtn = document.getElementById("loginBtn");
                    const errorMessage =
                        document.getElementById("errorMessage");

                    loginBtn.textContent = "Memproses...";
                    loginBtn.disabled = true;
                    errorMessage.classList.add("hidden");

                    try {
                        const formData = new FormData(e.target);
                        const response = await fetch("/api/login", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify({
                                username: formData.get("username"),
                                password: formData.get("password"),
                            }),
                        });

                        const result = await response.json();

                        if (result.success) {
                            window.location.href = "/dashboard.html";
                        } else {
                            errorMessage.textContent =
                                result.message || "Login gagal";
                            errorMessage.classList.remove("hidden");
                        }
                    } catch (error) {
                        errorMessage.textContent =
                            "Terjadi kesalahan. Silakan coba lagi.";
                        errorMessage.classList.remove("hidden");
                    }

                    loginBtn.textContent = "Masuk";
                    loginBtn.disabled = false;
                });
        </script>
    </body>
</html>
